name: Desktop installers

# jpackage can only build installers for the OS it runs on, so each
# platform gets its own runner.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tasks: ":desktopApp:packageMsi :desktopApp:packageExe"
            name: windows
          - os: ubuntu-latest
            tasks: ":desktopApp:packageDeb"
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :shared:jvmTest --console=plain

      - name: Build installers
        run: ./gradlew ${{ matrix.tasks }} --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: dori-${{ matrix.name }}
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
